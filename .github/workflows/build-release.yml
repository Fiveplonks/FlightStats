name: Build FlightStats Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: arm64
            runner: macos-14
            spec: FlightStats.spec

          - platform: macOS
            arch: x86_64
            runner: macos-15-intel
            spec: FlightStats.spec

          - platform: Windows
            arch: x86_64
            runner: windows-latest
            spec: FlightStats-windows.spec

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm "${{ matrix.spec }}"

      # ---------------------------------------------------
      # macOS verification and packaging
      # ---------------------------------------------------

      - name: Verify macOS application
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          test -f dist/FlightStats.app/Contents/MacOS/FlightStats
          file dist/FlightStats.app/Contents/MacOS/FlightStats

      - name: Package macOS application
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          mkdir -p release

          ditto -c -k --sequesterRsrc --keepParent \
            dist/FlightStats.app \
            "release/FlightStats-macOS-${{ matrix.arch }}.zip"

          ls -lh release/

      # ---------------------------------------------------
      # Windows verification and packaging
      # ---------------------------------------------------

      - name: Verify Windows application
        if: matrix.platform == 'Windows'
        shell: powershell
        run: |
          if (-not (Test-Path "dist\FlightStats\FlightStats.exe")) {
              throw "FlightStats.exe was not found"
          }

          if (-not (Test-Path "dist\FlightStats\FlightStats.ico")) {
              throw "FlightStats.ico was not bundled"
          }

          Get-Item "dist\FlightStats\FlightStats.exe"
          Get-Item "dist\FlightStats\FlightStats.ico"

      - name: Package Windows application
        if: matrix.platform == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          Compress-Archive `
            -Path "dist\FlightStats\*" `
            -DestinationPath "release\FlightStats-Windows-x86_64.zip" `
            -CompressionLevel Optimal

          Get-ChildItem release

      # ---------------------------------------------------
      # Upload platform build artifact
      # ---------------------------------------------------

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightStats-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish latest release
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          pattern: FlightStats-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          ls -lh release/

          test -f release/FlightStats-macOS-arm64.zip
          test -f release/FlightStats-macOS-x86_64.zip
          test -f release/FlightStats-Windows-x86_64.zip

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit latest \
              --repo "${{ github.repository }}" \
              --title "FlightStats Latest" \
              --notes "Latest successful FlightStats build from main. Commit: ${{ github.sha }}" \
              --target "${{ github.sha }}"
          else
            gh release create latest \
              --repo "${{ github.repository }}" \
              --title "FlightStats Latest" \
              --notes "Latest successful FlightStats build from main. Commit: ${{ github.sha }}" \
              --target "${{ github.sha }}"
          fi

          gh release upload latest \
            --repo "${{ github.repository }}" \
            --clobber \
            release/FlightStats-macOS-arm64.zip \
            release/FlightStats-macOS-x86_64.zip \
            release/FlightStats-Windows-x86_64.zip
